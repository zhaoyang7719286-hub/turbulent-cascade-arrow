name: Offline reproducibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python code/numerics/test_spectral_dns_core.py
      - run: python scripts/run_dynamic_cases.py --smoke
      - run: python scripts/reproduce_figures.py
      - run: python code/statistics/analyze_existing_tables.py
